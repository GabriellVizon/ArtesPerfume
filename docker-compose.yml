services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artesperfume
      POSTGRES_USER: artesperfume
      POSTGRES_PASSWORD: artesperfume
    ports:
      - "5432:5432"
    volumes:
      - artesperfume_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artesperfume -d artesperfume"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artesperfume_pgdata:
