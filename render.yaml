services:
  - type: web
    name: artesperfume
    runtime: node
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_SSL
        value: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: CATALOGO_MODE
        value: demo
      - key: CATALOGO_HASHTAG
        value: puxarparaocatalogo
      - key: DATABASE_URL
        fromDatabase:
          name: artesperfume-db
          property: connectionString
      - key: WHATSAPP_NUMBER
        sync: false
      - key: INSTAGRAM_LOGIN_MODE
        value: facebook
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: META_API_VERSION
        sync: false

databases:
  - name: artesperfume-db
